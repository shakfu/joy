name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-latest
            cmake_flags: ""
          - os: macos-latest
            cmake_flags: ""

    steps:
    - uses: actions/checkout@v4

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-cmake-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-${{ matrix.build_type }}-

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRUN_TESTS=ON ${{ matrix.cmake_flags }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    - name: Upload build artifacts
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: joy-${{ runner.os }}
        path: |
          build/joy
          build/libjoycore*
        retention-days: 7

  # Optional features, each in its own build
  features:
    name: ubuntu-latest (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: JOY_SESSION
            packages: libsqlite3-dev
          - feature: JOY_BLAS
            packages: libopenblas-dev
          - feature: JOY_PARALLEL
            packages: ""
          - feature: JOY_FFI
            packages: libffi-dev

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      if: matrix.packages != ''
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRUN_TESTS=ON -D${{ matrix.feature }}=ON

    - name: Build
      run: cmake --build build

    - name: Test
      working-directory: build
      run: ctest --output-on-failure

  # A collection at every allocation exposes indices held across one. Only
  # these tests: others are slow or still fail under it (see TODO.md).
  gc-stress:
    name: ubuntu-latest (JOY_GC_STRESS)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DRUN_TESTS=ON -DJOY_GC_STRESS=ON

    - name: Build
      run: cmake --build build --target joy

    - name: Test
      working-directory: build
      run: ctest --output-on-failure -R "test2_(gc_cases|lazy|json)$"

  # joy-lsp under AddressSanitizer: memory errors in the server only show
  # up reliably with a sanitizer. (The interpreter's conservative GC scans
  # the C stack, which ASan rejects, so only the LSP is built this way.)
  lsp-asan:
    name: ubuntu-latest (joy-lsp, ASan)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build --target joy-lsp

    - name: Test
      run: python3 tests/lsp/test_lsp.py build/joy-lsp

  # Windows build (separate due to different setup)
  build-windows:
    name: windows-latest (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: Windows-cmake-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
        restore-keys: |
          Windows-cmake-${{ matrix.build_type }}-

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRUN_TESTS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure
      continue-on-error: true  # Windows tests may have path issues

    - name: Upload build artifacts
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: joy-Windows
        path: |
          build/Release/joy.exe
          build/Release/*.dll
        retention-days: 7

  # Code quality checks (Linux only)
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find src include -name '*.c' -o -name '*.h' | head -20 | xargs clang-format --dry-run --Werror 2>/dev/null || echo "Formatting check completed (warnings only)"
      continue-on-error: true

  # Summary job that depends on all others
  ci-success:
    name: CI Success
    needs: [build, features, gc-stress, lsp-asan, build-windows, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check all jobs passed
      run: |
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build job failed"
          exit 1
        fi
        if [ "${{ needs.features.result }}" != "success" ]; then
          echo "Feature build job failed"
          exit 1
        fi
        if [ "${{ needs.gc-stress.result }}" != "success" ]; then
          echo "::error::GC stress tests failed"
          exit 1
        fi
        if [ "${{ needs.lsp-asan.result }}" != "success" ]; then
          echo "LSP sanitizer job failed"
          exit 1
        fi
        echo "All required checks passed!"
